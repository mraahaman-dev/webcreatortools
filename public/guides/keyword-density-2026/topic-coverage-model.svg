<!-- topic-coverage-model.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Topic Coverage, Not Phrase Repetition</text>

  <circle cx="400" cy="220" r="55" fill="#4F46E5"/>
  <text x="400" y="226" font-family="sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">Main topic</text>

  <circle cx="220" cy="120" r="38" fill="#818CF8"/>
  <text x="220" y="126" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Subtopic</text>
  <line x1="360" y1="190" x2="255" y2="145" stroke="#818CF8" stroke-width="2"/>

  <circle cx="580" y="120" r="38" fill="#818CF8"/>
  <circle cx="580" cy="120" r="38" fill="#818CF8"/>
  <text x="580" y="126" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Related term</text>
  <line x1="440" y1="190" x2="545" y2="145" stroke="#818CF8" stroke-width="2"/>

  <circle cx="200" cy="320" r="38" fill="#818CF8"/>
  <text x="200" y="326" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Question</text>
  <line x1="360" y1="250" x2="235" y2="295" stroke="#818CF8" stroke-width="2"/>

  <circle cx="600" cy="320" r="38" fill="#818CF8"/>
  <text x="600" y="326" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Entity</text>
  <line x1="440" y1="250" x2="565" y2="295" stroke="#818CF8" stroke-width="2"/>
</svg>