<!-- rule-specificity.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">More Specific Rule Wins</text>

  <rect x="80" y="100" width="640" height="80" rx="10" fill="#FECACA" stroke="#DC2626" stroke-width="2"/>
  <text x="400" y="145" font-family="monospace" font-size="18" fill="#991B1B" text-anchor="middle">Disallow: /admin/  (10 chars)</text>

  <rect x="80" y="220" width="640" height="80" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="265" font-family="monospace" font-size="18" fill="#166534" text-anchor="middle">Allow: /admin/public-page.html  (26 chars)</text>

  <text x="400" y="360" font-family="sans-serif" font-size="15" fill="#334155" text-anchor="middle">The longer, more specific path wins — this file stays crawlable</text>
</svg>