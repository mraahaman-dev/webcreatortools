<!-- directive-anatomy.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <rect x="60" y="40" width="680" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <text x="90" y="90" font-family="monospace" font-size="20" fill="#4F46E5">User-agent: *</text>
  <text x="480" y="90" font-family="sans-serif" font-size="14" fill="#64748B">Which crawler(s) this group applies to</text>

  <text x="90" y="150" font-family="monospace" font-size="20" fill="#DC2626">Disallow: /admin/</text>
  <text x="480" y="150" font-family="sans-serif" font-size="14" fill="#64748B">Path prefix the crawler should not request</text>

  <text x="90" y="210" font-family="monospace" font-size="20" fill="#16A34A">Allow: /admin/public.html</text>
  <text x="480" y="210" font-family="sans-serif" font-size="14" fill="#64748B">Exception within a broader Disallow</text>

  <text x="90" y="270" font-family="monospace" font-size="20" fill="#D97706">Sitemap: /sitemap.xml</text>
  <text x="480" y="270" font-family="sans-serif" font-size="14" fill="#64748B">Applies globally, not scoped to a group</text>
</svg>