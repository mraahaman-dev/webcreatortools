<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3730A3">Tags Map Directly to the Card</text>

  <!-- tags list -->
  <rect x="40" y="60" width="280" height="220" rx="10" fill="#1E1B4B"/>
  <text x="60" y="95" font-family="monospace" font-size="12" fill="#4ADE80">og:image</text>
  <text x="60" y="140" font-family="monospace" font-size="12" fill="#FCD34D">og:title</text>
  <text x="60" y="185" font-family="monospace" font-size="12" fill="#FCA5A5">og:description</text>
  <text x="60" y="230" font-family="monospace" font-size="12" fill="#A5B4FC">og:url</text>

  <!-- card -->
  <rect x="420" y="60" width="340" height="230" rx="12" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <rect x="420" y="60" width="340" height="110" fill="#BBF7D0"/>
  <text x="590" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#166534">image area</text>
  <rect x="435" y="185" width="280" height="14" rx="4" fill="#FDE68A"/>
  <rect x="435" y="210" width="240" height="12" rx="4" fill="#FECACA"/>
  <rect x="435" y="255" width="150" height="10" rx="4" fill="#C7D2FE"/>

  <g stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="150" y1="90" x2="530" y2="105"/>
    <line x1="150" y1="140" x2="440" y2="192"/>
    <line x1="150" y1="185" x2="440" y2="216"/>
    <line x1="150" y1="230" x2="440" y2="260"/>
  </g>

  <text x="400" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">Each tag fills one specific piece of the rendered card,</text>
  <text x="400" y="357" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">none of it is inferred automatically from page content.</text>
</svg>