<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3730A3">Recommended og:image Dimensions</text>

  <rect x="200" y="90" width="400" height="210" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <text x="400" y="205" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3730A3">1200 × 630 px</text>
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4338CA">1.91 : 1 ratio</text>

  <!-- width measure -->
  <line x1="200" y1="320" x2="600" y2="320" stroke="#818CF8" stroke-width="2"/>
  <g stroke="#818CF8" stroke-width="2">
    <line x1="200" y1="314" x2="200" y2="326"/>
    <line x1="600" y1="314" x2="600" y2="326"/>
  </g>
  <text x="400" y="345" text-anchor="middle" font-family="monospace" font-size="12" fill="#4338CA">1200px wide</text>

  <!-- height measure -->
  <line x1="630" y1="90" x2="630" y2="300" stroke="#818CF8" stroke-width="2"/>
  <g stroke="#818CF8" stroke-width="2">
    <line x1="624" y1="90" x2="636" y2="90"/>
    <line x1="624" y1="300" x2="636" y2="300"/>
  </g>
  <text x="665" y="200" text-anchor="middle" font-family="monospace" font-size="12" fill="#4338CA" transform="rotate(90 665 200)">630px tall</text>

  <text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">Displays cleanly across most platforms without significant cropping.</text>
</svg>