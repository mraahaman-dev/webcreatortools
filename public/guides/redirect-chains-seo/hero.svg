<!-- hero.svg -->
<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#EEF2FF"/>
  <text x="600" y="90" font-family="sans-serif" font-size="36" font-weight="700" fill="#3730A3" text-anchor="middle">Redirect Chain vs Direct Redirect</text>

  <circle cx="150" cy="260" r="40" fill="#DC2626"/>
  <text x="150" y="266" font-family="monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">A</text>
  <path d="M190 260 L310 260" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow1)"/>
  <circle cx="350" cy="260" r="40" fill="#DC2626"/>
  <text x="350" y="266" font-family="monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">B</text>
  <path d="M390 260 L510 260" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow1)"/>
  <circle cx="550" cy="260" r="40" fill="#DC2626"/>
  <text x="550" y="266" font-family="monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">C</text>
  <path d="M590 260 L710 260" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow1)"/>
  <circle cx="750" cy="260" r="40" fill="#16A34A"/>
  <text x="750" y="266" font-family="monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">D</text>
  <text x="450" y="340" font-family="sans-serif" font-size="16" fill="#991B1B" text-anchor="middle">Three hops, extra latency each step</text>

  <circle cx="150" cy="480" r="40" fill="#16A34A"/>
  <text x="150" y="486" font-family="monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">A</text>
  <path d="M190 480 L710 480" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow2)"/>
  <circle cx="750" cy="480" r="40" fill="#16A34A"/>
  <text x="750" y="486" font-family="monospace" font-size="16" fill="#FFFFFF" text-anchor="middle">D</text>
  <text x="450" y="550" font-family="sans-serif" font-size="16" fill="#166534" text-anchor="middle">One hop, straight to the destination</text>

  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#DC2626"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#16A34A"/></marker>
  </defs>
</svg>