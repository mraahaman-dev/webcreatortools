<!-- chain-vs-direct.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Same Destination, Different Paths</text>

  <text x="60" y="110" font-family="sans-serif" font-size="15" fill="#334155">Chain (3 hops):</text>
  <rect x="60" y="130" width="100" height="50" rx="8" fill="#FECACA"/>
  <text x="110" y="160" font-family="monospace" font-size="14" fill="#991B1B" text-anchor="middle">/old</text>
  <rect x="220" y="130" width="100" height="50" rx="8" fill="#FECACA"/>
  <text x="270" y="160" font-family="monospace" font-size="14" fill="#991B1B" text-anchor="middle">/mid</text>
  <rect x="380" y="130" width="100" height="50" rx="8" fill="#FECACA"/>
  <text x="430" y="160" font-family="monospace" font-size="14" fill="#991B1B" text-anchor="middle">/newer</text>
  <rect x="540" y="130" width="140" height="50" rx="8" fill="#BBF7D0"/>
  <text x="610" y="160" font-family="monospace" font-size="14" fill="#166534" text-anchor="middle">/final</text>

  <text x="60" y="260" font-family="sans-serif" font-size="15" fill="#334155">Direct (1 hop):</text>
  <rect x="60" y="280" width="100" height="50" rx="8" fill="#BBF7D0"/>
  <text x="110" y="310" font-family="monospace" font-size="14" fill="#166534" text-anchor="middle">/old</text>
  <rect x="540" y="280" width="140" height="50" rx="8" fill="#BBF7D0"/>
  <text x="610" y="310" font-family="monospace" font-size="14" fill="#166534" text-anchor="middle">/final</text>
  <path d="M165 305 L535 305" stroke="#16A34A" stroke-width="2" stroke-dasharray="6,4"/>
</svg>