<!-- hop-cost.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Cumulative Delay Per Hop</text>

  <rect x="120" y="300" width="100" height="60" fill="#818CF8"/>
  <text x="170" y="385" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">1 hop</text>

  <rect x="290" y="240" width="100" height="120" fill="#6366F1"/>
  <text x="340" y="385" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">2 hops</text>

  <rect x="460" y="160" width="100" height="200" fill="#4F46E5"/>
  <text x="510" y="385" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">3 hops</text>

  <rect x="630" y="80" width="100" height="280" fill="#3730A3"/>
  <text x="680" y="385" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">4 hops</text>

  <line x1="80" y1="360" x2="760" y2="360" stroke="#CBD5E1" stroke-width="2"/>
</svg>