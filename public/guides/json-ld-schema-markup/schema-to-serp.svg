<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3730A3">Schema on the Page, Result in Search</text>

  <!-- schema block -->
  <text x="180" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4B5563">Product schema on the page</text>
  <rect x="60" y="85" width="240" height="130" rx="10" fill="#1E1B4B"/>
  <text x="75" y="115" font-family="monospace" font-size="11" fill="#FCD34D">"@type": "Product",</text>
  <text x="75" y="135" font-family="monospace" font-size="11" fill="#4ADE80">"aggregateRating": {</text>
  <text x="90" y="155" font-family="monospace" font-size="11" fill="#4ADE80">"ratingValue": "4.8"</text>
  <text x="75" y="175" font-family="monospace" font-size="11" fill="#4ADE80">},</text>
  <text x="75" y="195" font-family="monospace" font-size="11" fill="#FCA5A5">"offers": {"price": "29"}</text>

  <g stroke="#818CF8" stroke-width="3" fill="none">
    <line x1="310" y1="150" x2="380" y2="150"/>
    <path d="M360 135 L380 150 L360 165"/>
  </g>

  <!-- search result -->
  <text x="580" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4B5563">Eligible search result</text>
  <rect x="450" y="85" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <text x="470" y="115" font-family="sans-serif" font-size="14" fill="#4F46E5">example.com/product</text>
  <text x="470" y="140" font-family="sans-serif" font-size="13" fill="#FBBF24">★★★★★ <tspan fill="#4B5563">4.8 · $29</tspan></text>
  <rect x="470" y="155" width="230" height="9" rx="4" fill="#E5E7EB"/>
  <rect x="470" y="172" width="180" height="9" rx="4" fill="#E5E7EB"/>

  <text x="400" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">Structured data makes the enhanced format possible;</text>
  <text x="400" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">the search engine still decides whether to actually show it.</text>
</svg>