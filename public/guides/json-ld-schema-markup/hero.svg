<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg14)"/>

  <!-- code block -->
  <rect x="110" y="180" width="450" height="270" rx="14" fill="#1E1B4B"/>
  <text x="135" y="220" font-family="monospace" font-size="14" fill="#A5B4FC">{</text>
  <text x="155" y="248" font-family="monospace" font-size="13" fill="#4ADE80">"@context": "schema.org",</text>
  <text x="155" y="274" font-family="monospace" font-size="13" fill="#FCD34D">"@type": "Article",</text>
  <text x="155" y="300" font-family="monospace" font-size="13" fill="#FCA5A5">"headline": "...",</text>
  <text x="155" y="326" font-family="monospace" font-size="13" fill="#FCA5A5">"author": {...}</text>
  <text x="135" y="352" font-family="monospace" font-size="14" fill="#A5B4FC">}</text>

  <!-- arrow -->
  <g stroke="#818CF8" stroke-width="5" fill="none">
    <line x1="580" y1="315" x2="650" y2="315"/>
    <path d="M625 290 L650 315 L625 340"/>
  </g>

  <!-- search result card -->
  <rect x="690" y="220" width="400" height="190" rx="14" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <text x="715" y="255" font-family="sans-serif" font-size="18" fill="#4F46E5">example.com/article</text>
  <text x="715" y="280" font-family="sans-serif" font-size="12" fill="#FBBF24">★★★★★ <tspan fill="#4B5563">4.8 rating</tspan></text>
  <rect x="715" y="295" width="350" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="715" y="313" width="300" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="715" y="331" width="250" height="10" rx="5" fill="#E5E7EB"/>
  <text x="715" y="380" font-family="sans-serif" font-size="11" fill="#166534">rich result</text>

  <text x="600" y="500" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#3730A3">JSON-LD Schema Markup</text>
  <text x="600" y="538" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4338CA">A beginner's guide with examples</text>
</svg>