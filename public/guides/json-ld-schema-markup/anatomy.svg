<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3730A3">Anatomy of a JSON-LD Block</text>

  <rect x="120" y="55" width="560" height="300" rx="10" fill="#1E1B4B"/>
  <text x="145" y="88" font-family="monospace" font-size="13" fill="#818CF8">&lt;script type="application/ld+json"&gt;</text>
  <text x="160" y="115" font-family="monospace" font-size="13" fill="#A5B4FC">{</text>
  <text x="180" y="140" font-family="monospace" font-size="13" fill="#4ADE80">"@context": "https://schema.org",</text>
  <text x="180" y="165" font-family="monospace" font-size="13" fill="#FCD34D">"@type": "Article",</text>
  <text x="180" y="190" font-family="monospace" font-size="13" fill="#FCA5A5">"headline": "How to Bake Bread",</text>
  <text x="180" y="215" font-family="monospace" font-size="13" fill="#FCA5A5">"datePublished": "2026-08-01"</text>
  <text x="160" y="240" font-family="monospace" font-size="13" fill="#A5B4FC">}</text>
  <text x="145" y="265" font-family="monospace" font-size="13" fill="#818CF8">&lt;/script&gt;</text>

  <g stroke="#818CF8" stroke-width="1.5">
    <line x1="145" y1="280" x2="100" y2="310"/>
    <line x1="330" y1="280" x2="330" y2="310"/>
    <line x1="240" y1="280" x2="240" y2="310"/>
    <line x1="620" y1="280" x2="650" y2="310"/>
  </g>

  <text x="100" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4B5563">wrapper</text>
  <text x="240" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">context</text>
  <text x="330" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400E">type</text>
  <text x="650" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991B1B">properties</text>

  <text x="400" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">Same four-part structure regardless of which schema.org type is used.</text>
</svg>