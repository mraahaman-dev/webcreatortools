<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="tileGood" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#EEF2FF"/>
      <circle cx="10" cy="10" r="4" fill="#4F46E5"/>
    </pattern>
    <pattern id="tileBad" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#FEF2F2"/>
      <circle cx="10" cy="10" r="4" fill="#DC2626"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Tile Size Must Match Content</text>

  <!-- good -->
  <text x="200" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">width/height matches dot spacing</text>
  <rect x="90" y="95" width="220" height="180" rx="10" fill="url(#tileGood)" stroke="#16A34A" stroke-width="2"/>
  <text x="200" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">clean, even tiling</text>

  <!-- bad -->
  <text x="600" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991B1B">tile larger than dot spacing</text>
  <rect x="490" y="95" width="220" height="180" rx="10" fill="url(#tileBad)" stroke="#DC2626" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991B1B">visible gaps between dots</text>

  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">The pattern tile's width and height should equal the actual spacing of its content.</text>
</svg>