<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="dRadial" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Linear vs. Radial Gradient</text>

  <!-- linear -->
  <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">linearGradient</text>
  <rect x="90" y="100" width="220" height="180" rx="14" fill="url(#dLinear)"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 4" opacity="0.8">
    <line x1="90" y1="100" x2="310" y2="280"/>
  </g>
  <text x="200" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6B7280">follows x1/y1 → x2/y2</text>

  <!-- radial -->
  <text x="600" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">radialGradient</text>
  <circle cx="600" cy="190" r="90" fill="url(#dRadial)"/>
  <circle cx="600" cy="190" r="4" fill="#FFFFFF"/>
  <text x="600" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6B7280">expands from cx/cy outward by r</text>

  <text x="400" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Both use &lt;stop&gt; elements for color; only the direction of the fade differs.</text>
</svg>