<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Signed vs. Encrypted</text>

  <!-- signed (JWT) -->
  <text x="200" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">Signed JWT (JWS)</text>
  <rect x="80" y="95" width="240" height="90" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="100" y="125" font-family="monospace" font-size="12" fill="#166534">{ "role": "editor" }</text>
  <text x="100" y="150" font-family="sans-serif" font-size="11" fill="#166534">readable by anyone</text>
  <text x="100" y="168" font-family="sans-serif" font-size="11" fill="#166534">tampering breaks signature</text>

  <circle cx="330" cy="140" r="18" fill="none" stroke="#16A34A" stroke-width="3"/>
  <path d="M322 140 L328 146 L340 132" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- encrypted (JWE) -->
  <text x="600" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">Encrypted JWE</text>
  <rect x="480" y="95" width="240" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="500" y="125" font-family="monospace" font-size="12" fill="#991B1B">8f2a1c9e4b7d3a...</text>
  <text x="500" y="150" font-family="sans-serif" font-size="11" fill="#991B1B">contents hidden</text>
  <text x="500" y="168" font-family="sans-serif" font-size="11" fill="#991B1B">needs decryption key to read</text>

  <text x="400" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">A standard JWT is signed (JWS): tamper-evident, but always readable.</text>
  <text x="400" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Hiding the payload requires the separate JWE standard.</text>
</svg>