<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg5)"/>

  <!-- token string -->
  <rect x="150" y="150" width="900" height="70" rx="12" fill="#1E1B4B"/>
  <text x="180" y="193" font-family="monospace" font-size="20" fill="#818CF8">eyJhbGciOiJIUzI1NiJ9</text>
  <text x="440" y="193" font-family="monospace" font-size="20" fill="#F59E0B">.</text>
  <text x="460" y="193" font-family="monospace" font-size="20" fill="#4ADE80">eyJzdWIiOiJ1c2VyXzEyMyJ9</text>
  <text x="770" y="193" font-family="monospace" font-size="20" fill="#F59E0B">.</text>
  <text x="790" y="193" font-family="monospace" font-size="20" fill="#FCA5A5">4f3a9c8b1e2d</text>

  <!-- arrows down to 3 boxes -->
  <g stroke="#818CF8" stroke-width="3" fill="none">
    <line x1="300" y1="220" x2="260" y2="290"/>
    <line x1="600" y1="220" x2="600" y2="290"/>
    <line x1="880" y1="220" x2="920" y2="290"/>
  </g>

  <!-- header box -->
  <rect x="130" y="300" width="260" height="120" rx="14" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="260" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3730A3">Header</text>
  <text x="150" y="365" font-family="monospace" font-size="12" fill="#4338CA">alg: "HS256"</text>
  <text x="150" y="385" font-family="monospace" font-size="12" fill="#4338CA">typ: "JWT"</text>

  <!-- payload box -->
  <rect x="470" y="300" width="260" height="120" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="600" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">Payload</text>
  <text x="490" y="365" font-family="monospace" font-size="12" fill="#166534">sub: "user_123"</text>
  <text x="490" y="385" font-family="monospace" font-size="12" fill="#166534">exp: 1755043200</text>

  <!-- signature box -->
  <rect x="810" y="300" width="260" height="120" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="940" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991B1B">Signature</text>
  <text x="830" y="365" font-family="monospace" font-size="12" fill="#991B1B">HMACSHA256(</text>
  <text x="830" y="385" font-family="monospace" font-size="12" fill="#991B1B">header + payload,</text>
  <text x="830" y="405" font-family="monospace" font-size="12" fill="#991B1B">secret)</text>

  <text x="600" y="500" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#3730A3">What Is a JWT?</text>
  <text x="600" y="538" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4338CA">How JSON Web Tokens work</text>
</svg>