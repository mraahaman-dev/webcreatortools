<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="rasterVectorTitle">
  <title id="rasterVectorTitle">Comparison of a raster circle scaled up, which becomes blocky, versus a vector circle scaled up, which stays smooth</title>

  <!-- Raster side -->
  <g transform="translate(20,20)">
    <rect width="360" height="380" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="180" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#991B1B">Raster, scaled up</text>

    <!-- blocky pixel circle approximation -->
    <g transform="translate(60,70)">
      <!-- grid of squares forming a rough circle -->
      <g fill="#EF4444">
        <rect x="80" y="0" width="80" height="40"/>
        <rect x="40" y="40" width="40" height="40"/>
        <rect x="160" y="40" width="40" height="40"/>
        <rect x="0" y="80" width="40" height="80"/>
        <rect x="200" y="80" width="40" height="80"/>
        <rect x="40" y="160" width="40" height="40"/>
        <rect x="160" y="160" width="40" height="40"/>
        <rect x="80" y="200" width="80" height="40"/>
      </g>
      <g fill="#FCA5A5">
        <rect x="80" y="40" width="80" height="120"/>
      </g>
      <!-- grid lines to emphasize pixelation -->
      <g stroke="#FEE2E2" stroke-width="1">
        <line x1="0" y1="40" x2="240" y2="40"/>
        <line x1="0" y1="80" x2="240" y2="80"/>
        <line x1="0" y1="120" x2="240" y2="120"/>
        <line x1="0" y1="160" x2="240" y2="160"/>
        <line x1="0" y1="200" x2="240" y2="200"/>
        <line x1="40" y1="0" x2="40" y2="240"/>
        <line x1="80" y1="0" x2="80" y2="240"/>
        <line x1="120" y1="0" x2="120" y2="240"/>
        <line x1="160" y1="0" x2="160" y2="240"/>
        <line x1="200" y1="0" x2="200" y2="240"/>
      </g>
    </g>
    <text x="180" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#B91C1C">Jagged, blocky edges appear</text>
  </g>

  <!-- Vector side -->
  <g transform="translate(420,20)">
    <rect width="360" height="380" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <text x="180" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#3730A3">Vector, scaled up</text>

    <circle cx="180" cy="190" r="115" fill="#4F46E5"/>
    <circle cx="180" cy="190" r="115" fill="none" stroke="#312E81" stroke-width="1" opacity="0.15"/>

    <text x="180" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4338CA">Edge stays perfectly smooth</text>
  </g>
</svg>