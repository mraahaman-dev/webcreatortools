<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="anatomyTitle">
  <title id="anatomyTitle">A shape sitting inside a labeled coordinate grid, illustrating how the viewBox attribute defines an SVG's internal coordinate space</title>

  <rect width="800" height="420" fill="#FAFAFA" rx="12"/>

  <g transform="translate(140,40)">
    <!-- coordinate grid -->
    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="320"/>
      <line x1="80" y1="0" x2="80" y2="320"/>
      <line x1="160" y1="0" x2="160" y2="320"/>
      <line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="320" y1="0" x2="320" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="480" y1="0" x2="480" y2="320"/>
      <line x1="0" y1="0" x2="480" y2="0"/>
      <line x1="0" y1="80" x2="480" y2="80"/>
      <line x1="0" y1="160" x2="480" y2="160"/>
      <line x1="0" y1="240" x2="480" y2="240"/>
      <line x1="0" y1="320" x2="480" y2="320"/>
    </g>

    <!-- axes -->
    <line x1="0" y1="0" x2="0" y2="320" stroke="#94A3B8" stroke-width="2"/>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#94A3B8" stroke-width="2"/>

    <!-- origin label -->
    <circle cx="0" cy="0" r="5" fill="#4F46E5"/>
    <text x="-10" y="-12" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#4F46E5" text-anchor="start">0, 0</text>

    <!-- the shape: a rounded star-ish path -->
    <path d="M240 60 L280 150 L380 160 L305 225 L330 320 L240 265 L150 320 L175 225 L100 160 L200 150 Z"
          fill="#4F46E5" opacity="0.9"/>

    <!-- anchor points on the shape -->
    <g fill="#ffffff" stroke="#312E81" stroke-width="2.5">
      <circle cx="240" cy="60" r="5"/>
      <circle cx="380" cy="160" r="5"/>
      <circle cx="330" cy="320" r="5"/>
      <circle cx="150" cy="320" r="5"/>
      <circle cx="100" cy="160" r="5"/>
    </g>

    <text x="240" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#334155">
      viewBox="0 0 24 24" — everything inside is positioned on this grid
    </text>
  </g>
</svg>