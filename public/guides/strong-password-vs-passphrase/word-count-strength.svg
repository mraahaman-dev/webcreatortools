<!-- word-count-strength.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Each Word Multiplies Possible Combinations</text>

  <g font-family="monospace" font-size="16" fill="#3730A3">
    <rect x="80" y="90" width="150" height="60" rx="10" fill="#C7D2FE"/>
    <text x="155" y="125" text-anchor="middle">correct</text>

    <rect x="80" y="170" width="150" height="60" rx="10" fill="#A5B4FC"/>
    <text x="155" y="205" text-anchor="middle">+ horse</text>

    <rect x="80" y="250" width="150" height="60" rx="10" fill="#818CF8"/>
    <text x="155" y="285" text-anchor="middle">+ battery</text>

    <rect x="80" y="330" width="150" height="60" rx="10" fill="#6366F1"/>
    <text x="155" y="365" fill="#EEF2FF" text-anchor="middle">+ staple</text>
  </g>

  <text x="450" y="125" font-family="sans-serif" font-size="15" fill="#334155">1 word ≈ a few thousand options</text>
  <text x="450" y="205" font-family="sans-serif" font-size="15" fill="#334155">2 words ≈ millions of combinations</text>
  <text x="450" y="285" font-family="sans-serif" font-size="15" fill="#334155">3 words ≈ billions of combinations</text>
  <text x="450" y="365" font-family="sans-serif" font-size="15" fill="#334155">4 words ≈ trillions of combinations</text>
</svg>