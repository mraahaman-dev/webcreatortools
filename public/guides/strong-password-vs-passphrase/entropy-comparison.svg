<!-- entropy-comparison.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Approximate Entropy Comparison</text>

  <rect x="150" y="300" width="120" height="60" fill="#DC2626"/>
  <text x="210" y="390" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">8-char complex</text>
  <text x="210" y="285" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">~52 bits</text>

  <rect x="530" y="120" width="120" height="240" fill="#16A34A"/>
  <text x="590" y="390" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">5-word passphrase</text>
  <text x="590" y="105" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">~64+ bits</text>

  <line x1="100" y1="360" x2="700" y2="360" stroke="#CBD5E1" stroke-width="2"/>
</svg>