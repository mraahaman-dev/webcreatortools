<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Greedy vs. Lazy Quantifier</text>

  <text x="400" y="75" text-anchor="middle" font-family="monospace" font-size="16" fill="#4B5563">&lt;b&gt;bold&lt;/b&gt; and &lt;i&gt;italic&lt;/i&gt;</text>

  <!-- greedy -->
  <text x="130" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991B1B">Greedy: &lt;.+&gt;</text>
  <rect x="290" y="100" width="420" height="22" fill="#FECACA" opacity="0.8"/>
  <text x="400" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991B1B">matches from the first &lt; to the very last &gt;</text>

  <!-- lazy -->
  <text x="130" y="200" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">Lazy: &lt;.+?&gt;</text>
  <rect x="290" y="185" width="42" height="22" fill="#BBF7D0"/>
  <text x="400" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">stops at the first possible closing &gt;</text>

  <text x="400" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">A trailing ? after a quantifier switches it from "as much as possible"</text>
  <text x="400" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">to "as little as possible" while still satisfying the pattern.</text>
</svg>