<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Anatomy of a Pattern</text>

  <rect x="60" y="70" width="680" height="50" rx="8" fill="#1E1B4B"/>
  <text x="80" y="103" font-family="monospace" font-size="18" fill="#A5B4FC">^</text>
  <text x="100" y="103" font-family="monospace" font-size="18" fill="#4ADE80">[\w.+-]+</text>
  <text x="235" y="103" font-family="monospace" font-size="18" fill="#FCD34D">@</text>
  <text x="255" y="103" font-family="monospace" font-size="18" fill="#4ADE80">[\w-]+</text>
  <text x="345" y="103" font-family="monospace" font-size="18" fill="#FCD34D">\.</text>
  <text x="375" y="103" font-family="monospace" font-size="18" fill="#FCA5A5">[a-zA-Z]{2,}</text>
  <text x="580" y="103" font-family="monospace" font-size="18" fill="#A5B4FC">$</text>

  <!-- labels with lines -->
  <g stroke="#818CF8" stroke-width="1.5" fill="none">
    <line x1="85" y1="120" x2="85" y2="160"/>
    <line x1="150" y1="120" x2="150" y2="200"/>
    <line x1="245" y1="120" x2="245" y2="160"/>
    <line x1="300" y1="120" x2="300" y2="200"/>
    <line x1="450" y1="120" x2="450" y2="160"/>
    <line x1="585" y1="120" x2="585" y2="160"/>
  </g>

  <text x="85" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4B5563">anchor:</text>
  <text x="85" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4B5563">start</text>

  <text x="150" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">character class</text>
  <text x="150" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">+ "one or more"</text>

  <text x="245" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400E">literal @</text>

  <text x="300" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">domain part</text>

  <text x="450" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400E">escaped dot</text>

  <text x="585" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4B5563">anchor: end</text>

  <text x="400" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">Anchors lock the match to the whole string; character classes define what counts;</text>
  <text x="400" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">quantifiers say how many; escaped characters mean "this literal symbol."</text>
</svg>