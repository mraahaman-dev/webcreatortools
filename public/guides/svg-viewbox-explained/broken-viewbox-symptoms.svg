<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FAFAF9"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Three common symptoms, one root cause</text>

  <!-- Panel 1: no viewBox, cropped -->
  <g>
    <rect x="55" y="80" width="200" height="220" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <clipPath id="cropClip">
      <rect x="105" y="130" width="100" height="100"/>
    </clipPath>
    <g clip-path="url(#cropClip)">
      <circle cx="155" cy="180" r="55" fill="#DC2626" opacity="0.75"/>
    </g>
    <rect x="105" y="130" width="100" height="100" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="155" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B91C1C">No viewBox</text>
    <text x="155" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991B1B">Content gets cropped</text>
  </g>

  <!-- Panel 2: wrong aspect ratio, stretched -->
  <g>
    <rect x="300" y="80" width="200" height="220" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <ellipse cx="400" cy="190" rx="65" ry="35" fill="#D97706" opacity="0.8"/>
    <text x="400" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B45309">Mismatched ratio</text>
    <text x="400" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400E">Circle renders squished</text>
  </g>

  <!-- Panel 3: correct -->
  <g>
    <rect x="545" y="80" width="200" height="220" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <circle cx="645" cy="190" r="50" fill="#16A34A" opacity="0.85"/>
    <text x="645" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803D">Correct viewBox</text>
    <text x="645" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Renders as intended</text>
  </g>
</svg>