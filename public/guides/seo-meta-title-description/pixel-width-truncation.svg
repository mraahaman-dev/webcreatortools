<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3730A3">Same Character Count, Different Pixel Width</text>

  <!-- narrow title fits -->
  <text x="120" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">Narrow letters (56 chars) — fits</text>
  <rect x="60" y="95" width="600" height="34" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="75" y="118" font-family="sans-serif" font-size="14" fill="#166534">tiny tips: a minimal list-item time saver in tint</text>
  <line x1="660" y1="90" x2="660" y2="132" stroke="#16A34A" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="660" y="150" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">~560px</text>

  <!-- wide title truncates -->
  <text x="120" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991B1B">Wide letters (56 chars) — truncated</text>
  <rect x="60" y="215" width="600" height="34" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="75" y="238" font-family="sans-serif" font-size="14" fill="#991B1B">MWM Wholesale Warehouse Manager Workflow Modu...</text>
  <line x1="600" y1="210" x2="600" y2="252" stroke="#DC2626" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="10" fill="#991B1B">~600px, cut off</text>

  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">Wide capital letters like W and M consume far more pixel width</text>
  <text x="400" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">than narrow lowercase letters, at the identical character count.</text>
</svg>