<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Counting Forward From the Epoch</text>

  <line x1="80" y1="200" x2="720" y2="200" stroke="#C7D2FE" stroke-width="3"/>

  <circle cx="80" cy="200" r="10" fill="#4F46E5"/>
  <text x="80" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3730A3">Jan 1, 1970</text>
  <text x="80" y="248" text-anchor="middle" font-family="monospace" font-size="12" fill="#6366F1">timestamp: 0</text>

  <circle cx="300" cy="200" r="7" fill="#818CF8"/>
  <text x="300" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#4338CA">1000000000</text>
  <text x="300" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6366F1">Sep 2001</text>

  <circle cx="500" cy="200" r="7" fill="#818CF8"/>
  <text x="500" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#4338CA">1500000000</text>
  <text x="500" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6366F1">Jul 2017</text>

  <circle cx="720" cy="200" r="10" fill="#4F46E5"/>
  <text x="720" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#3730A3">1755043200</text>
  <text x="720" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3730A3">now</text>

  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Comparing two timestamps is just comparing two plain numbers,</text>
  <text x="400" y="342" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">no date-parsing logic needed.</text>
</svg>