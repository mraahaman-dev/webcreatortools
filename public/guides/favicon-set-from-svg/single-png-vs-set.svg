<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Scaled PNG vs. Purpose-Built Set</text>

  <!-- left: single png scaled -->
  <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#B45309">One 512px PNG, scaled down</text>
  <rect x="120" y="100" width="160" height="160" rx="16" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <circle cx="200" cy="180" r="55" fill="#D97706"/>
  <text x="200" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400E">512x512 source</text>

  <g stroke="#D97706" stroke-width="2" fill="none">
    <path d="M280 180 L340 180"/>
    <path d="M320 165 L340 180 L320 195"/>
  </g>

  <rect x="355" y="160" width="40" height="40" rx="6" fill="#FDE68A" stroke="#D97706"/>
  <circle cx="375" cy="180" r="12" fill="#D97706" filter="url(#blur1)"/>
  <text x="375" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400E">16x16 (blurry)</text>

  <!-- right: purpose built set -->
  <text x="620" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">Purpose-built multi-size set</text>
  <rect x="560" y="110" width="24" height="24" rx="4" fill="#16A34A"/>
  <text x="572" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">16px</text>

  <rect x="605" y="100" width="40" height="40" rx="6" fill="#16A34A"/>
  <text x="625" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">32px</text>

  <rect x="665" y="90" width="56" height="56" rx="8" fill="#16A34A"/>
  <text x="693" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">48px</text>

  <text x="640" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">Each size drawn crisp at its own resolution</text>

  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Browser-side scaling softens fine detail; pre-rendered sizes stay sharp.</text>
</svg>