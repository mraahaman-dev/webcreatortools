<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">One Source SVG, Four Output Files</text>

  <!-- source -->
  <rect x="60" y="170" width="140" height="80" rx="12" fill="#4F46E5"/>
  <path d="M95 210 L120 235 L165 190" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="270" text-anchor="middle" font-family="monospace" font-size="13" fill="#3730A3">logo.svg</text>

  <!-- arrows -->
  <g stroke="#818CF8" stroke-width="3" fill="none">
    <line x1="200" y1="190" x2="330" y2="90"/>
    <line x1="200" y1="205" x2="330" y2="175"/>
    <line x1="200" y1="220" x2="330" y2="260"/>
    <line x1="200" y1="235" x2="330" y2="345"/>
  </g>

  <!-- outputs -->
  <rect x="340" y="65" width="220" height="50" rx="8" fill="#EEF2FF" stroke="#818CF8"/>
  <text x="450" y="96" text-anchor="middle" font-family="monospace" font-size="13" fill="#3730A3">favicon.svg (any size)</text>

  <rect x="340" y="150" width="220" height="50" rx="8" fill="#FDE68A" stroke="#D97706"/>
  <text x="450" y="181" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400E">favicon.ico (16/32/48)</text>

  <rect x="340" y="235" width="220" height="50" rx="8" fill="#BBF7D0" stroke="#16A34A"/>
  <text x="450" y="266" text-anchor="middle" font-family="monospace" font-size="13" fill="#166534">apple-touch-icon.png (180)</text>

  <rect x="340" y="320" width="220" height="50" rx="8" fill="#FECACA" stroke="#DC2626"/>
  <text x="450" y="351" text-anchor="middle" font-family="monospace" font-size="13" fill="#991B1B">manifest icons (192/512)</text>
</svg>