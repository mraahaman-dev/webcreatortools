<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg8)"/>

  <!-- messy blob -->
  <rect x="130" y="220" width="380" height="190" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="150" y="255" font-family="monospace" font-size="13" fill="#991B1B">{'name':val,age:9,}</text>
  <text x="150" y="280" font-family="monospace" font-size="13" fill="#991B1B">// broken JSON</text>
  <text x="320" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#991B1B">invalid</text>

  <!-- arrow -->
  <g stroke="#818CF8" stroke-width="5" fill="none">
    <line x1="530" y1="315" x2="640" y2="315"/>
    <path d="M615 290 L640 315 L615 340"/>
  </g>

  <!-- clean formatted -->
  <rect x="680" y="180" width="400" height="270" rx="14" fill="#1E1B4B"/>
  <text x="705" y="215" font-family="monospace" font-size="14" fill="#A5B4FC">{</text>
  <text x="725" y="245" font-family="monospace" font-size="14" fill="#4ADE80">"name": "value",</text>
  <text x="725" y="275" font-family="monospace" font-size="14" fill="#4ADE80">"age": 9</text>
  <text x="705" y="305" font-family="monospace" font-size="14" fill="#A5B4FC">}</text>
  <text x="880" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4ADE80">valid &amp; formatted</text>

  <text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#3730A3">Validate and Format Messy JSON</text>
</svg>