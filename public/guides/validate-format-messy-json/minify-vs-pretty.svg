<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Minified vs. Pretty-Printed</text>

  <!-- minified -->
  <text x="200" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">Minified</text>
  <rect x="60" y="95" width="290" height="70" rx="8" fill="#1E1B4B"/>
  <text x="75" y="125" font-family="monospace" font-size="10" fill="#818CF8">{"name":"value","age":9,</text>
  <text x="75" y="142" font-family="monospace" font-size="10" fill="#818CF8">"tags":["a","b"]}</text>
  <text x="200" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">smallest size, for the network</text>

  <!-- pretty -->
  <text x="600" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">Pretty-printed</text>
  <rect x="450" y="95" width="300" height="200" rx="8" fill="#1E1B4B"/>
  <text x="465" y="120" font-family="monospace" font-size="11" fill="#A5B4FC">{</text>
  <text x="485" y="142" font-family="monospace" font-size="11" fill="#4ADE80">"name": "value",</text>
  <text x="485" y="164" font-family="monospace" font-size="11" fill="#4ADE80">"age": 9,</text>
  <text x="485" y="186" font-family="monospace" font-size="11" fill="#4ADE80">"tags": [</text>
  <text x="505" y="208" font-family="monospace" font-size="11" fill="#FCD34D">"a",</text>
  <text x="505" y="230" font-family="monospace" font-size="11" fill="#FCD34D">"b"</text>
  <text x="485" y="252" font-family="monospace" font-size="11" fill="#4ADE80">]</text>
  <text x="465" y="274" font-family="monospace" font-size="11" fill="#A5B4FC">}</text>
  <text x="600" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">readable structure, for debugging</text>

  <text x="400" y="375" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">Same underlying data, two different formats for two different readers.</text>
</svg>