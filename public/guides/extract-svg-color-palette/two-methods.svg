<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FAFAF9"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Reading versus sampling</text>

  <!-- Left panel: SVG markup -->
  <g>
    <rect x="55" y="70" width="320" height="290" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="80" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4338CA">SVG file</text>
    <rect x="80" y="120" width="270" height="140" rx="6" fill="white" stroke="#DDD6FE"/>
    <text x="95" y="142" font-family="monospace" font-size="11" fill="#6366F1">&lt;circle fill="<tspan fill="#4F46E5" font-weight="700">#4F46E5</tspan>"/&gt;</text>
    <text x="95" y="164" font-family="monospace" font-size="11" fill="#6366F1">&lt;rect fill="<tspan fill="#F59E0B" font-weight="700">#F59E0B</tspan>"/&gt;</text>
    <text x="95" y="186" font-family="monospace" font-size="11" fill="#6366F1">&lt;path stroke="<tspan fill="#0F172A" font-weight="700">#0F172A</tspan>"/&gt;</text>
    <text x="80" y="288" font-family="system-ui, sans-serif" font-size="12" fill="#4F46E5">Colors read directly, exact values</text>
  </g>

  <!-- Right panel: raster pixels -->
  <g>
    <rect x="425" y="70" width="320" height="290" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="450" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803D">Raster logo (PNG/JPG)</text>
    <!-- pixel grid suggestion -->
    <g transform="translate(450,120)">
      <rect x="0" y="0" width="18" height="18" fill="#4F46E5"/>
      <rect x="20" y="0" width="18" height="18" fill="#4F49E8"/>
      <rect x="40" y="0" width="18" height="18" fill="#4E45E3"/>
      <rect x="60" y="0" width="18" height="18" fill="#524FE9"/>
      <rect x="0" y="20" width="18" height="18" fill="#4F46E5"/>
      <rect x="20" y="20" width="18" height="18" fill="#5148E6"/>
      <rect x="40" y="20" width="18" height="18" fill="#4D44E2"/>
      <rect x="60" y="20" width="18" height="18" fill="#4F46E5"/>
    </g>
    <text x="580" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#166534">Many near-identical pixels →</text>
    <rect x="450" y="200" width="40" height="40" rx="6" fill="#4F46E5"/>
    <text x="500" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#15803D" font-weight="700">clustered into one color</text>
    <text x="450" y="288" font-family="system-ui, sans-serif" font-size="12" fill="#15803D">Colors estimated, sampled from pixels</text>
  </g>
</svg>