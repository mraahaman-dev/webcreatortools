<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="attrMapTitle">
  <title id="attrMapTitle">A mapping of SVG attribute names on the left to their JSX equivalents on the right, including class to className and stroke-width to strokeWidth</title>

  <rect width="800" height="420" fill="#FAFAFA" rx="12"/>

  <text x="200" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#64748B">Raw SVG</text>
  <text x="600" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#3730A3">JSX</text>

  <g font-family="ui-monospace, monospace" font-size="16">
    <text x="80" y="90" fill="#475569">class</text>
    <text x="520" y="90" fill="#4F46E5" font-weight="600">className</text>

    <text x="80" y="140" fill="#475569">stroke-width</text>
    <text x="520" y="140" fill="#4F46E5" font-weight="600">strokeWidth</text>

    <text x="80" y="190" fill="#475569">fill-rule</text>
    <text x="520" y="190" fill="#4F46E5" font-weight="600">fillRule</text>

    <text x="80" y="240" fill="#475569">stroke-linecap</text>
    <text x="520" y="240" fill="#4F46E5" font-weight="600">strokeLinecap</text>

    <text x="80" y="290" fill="#475569">xlink:href</text>
    <text x="520" y="290" fill="#4F46E5" font-weight="600">xlinkHref</text>

    <text x="80" y="340" fill="#475569">aria-hidden</text>
    <text x="520" y="340" fill="#059669" font-weight="600">aria-hidden (unchanged)</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="220" y1="82" x2="480" y2="82"/>
    <line x1="220" y1="132" x2="480" y2="132"/>
    <line x1="220" y1="182" x2="480" y2="182"/>
    <line x1="220" y1="232" x2="480" y2="232"/>
    <line x1="220" y1="282" x2="480" y2="282"/>
    <line x1="220" y1="332" x2="480" y2="332"/>
  </g>

  <text x="400" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">
    aria-* and data-* are the one exception: they stay exactly as written
  </text>
</svg>