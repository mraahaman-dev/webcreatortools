<!-- perceptual-uniformity.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="60" y="60" font-family="sans-serif" font-size="16" font-weight="600" fill="#0F172A">HSL — same lightness (50%), uneven perceived brightness</text>
  <rect x="60" y="80" width="150" height="90" fill="hsl(0 100% 50%)"/>
  <rect x="220" y="80" width="150" height="90" fill="hsl(60 100% 50%)"/>
  <rect x="380" y="80" width="150" height="90" fill="hsl(120 100% 50%)"/>
  <rect x="540" y="80" width="150" height="90" fill="hsl(240 100% 50%)"/>
  <text x="60" y="220" font-family="sans-serif" font-size="16" font-weight="600" fill="#0F172A">OKLCH — same lightness (0.7), even perceived brightness</text>
  <rect x="60" y="240" width="150" height="90" fill="oklch(0.7 0.15 25)"/>
  <rect x="220" y="240" width="150" height="90" fill="oklch(0.7 0.15 110)"/>
  <rect x="380" y="240" width="150" height="90" fill="oklch(0.7 0.15 145)"/>
  <rect x="540" y="240" width="150" height="90" fill="oklch(0.7 0.15 260)"/>
  <text x="400" y="380" font-family="sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Top row: yellow reads far brighter than blue despite equal HSL lightness. Bottom row: OKLCH keeps them visually even.</text>
</svg>