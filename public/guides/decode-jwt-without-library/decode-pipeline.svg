<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Three Steps to a Readable Object</text>

  <rect x="40" y="90" width="200" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991B1B">1. Raw segment</text>
  <text x="60" y="155" font-family="monospace" font-size="11" fill="#991B1B">eyJzdWIiOi...</text>
  <text x="60" y="172" font-family="sans-serif" font-size="10" fill="#991B1B">base64url text</text>

  <g stroke="#818CF8" stroke-width="2" fill="none">
    <line x1="240" y1="140" x2="290" y2="140"/>
    <path d="M278 128 L290 140 L278 152"/>
  </g>

  <rect x="300" y="90" width="200" height="100" rx="10" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400E">2. atob()</text>
  <text x="320" y="155" font-family="monospace" font-size="11" fill="#92400E">'{"sub":"user_...</text>
  <text x="320" y="172" font-family="sans-serif" font-size="10" fill="#92400E">plain JSON string</text>

  <g stroke="#818CF8" stroke-width="2" fill="none">
    <line x1="500" y1="140" x2="550" y2="140"/>
    <path d="M538 128 L550 140 L538 152"/>
  </g>

  <rect x="560" y="90" width="200" height="100" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="2"/>
  <text x="660" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">3. JSON.parse()</text>
  <text x="580" y="155" font-family="monospace" font-size="11" fill="#166534">sub: "user_123"</text>
  <text x="580" y="172" font-family="sans-serif" font-size="10" fill="#166534">usable JS object</text>

  <text x="400" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Convert base64url to base64, decode with atob(), then parse the JSON text.</text>
  <text x="400" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Works identically for the header and payload segments.</text>
</svg>