<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg6)"/>

  <!-- console window -->
  <rect x="150" y="150" width="900" height="330" rx="16" fill="#1E1B4B"/>
  <circle cx="190" cy="185" r="8" fill="#DC2626"/>
  <circle cx="220" cy="185" r="8" fill="#F59E0B"/>
  <circle cx="250" cy="185" r="8" fill="#16A34A"/>

  <text x="180" y="235" font-family="monospace" font-size="16" fill="#818CF8">&gt; atob(base64Url</text>
  <text x="180" y="260" font-family="monospace" font-size="16" fill="#818CF8">    .replace(/-/g,'+')</text>
  <text x="180" y="285" font-family="monospace" font-size="16" fill="#818CF8">    .replace(/_/g,'/'))</text>

  <text x="180" y="335" font-family="monospace" font-size="16" fill="#4ADE80">&lt; '{"sub":"user_123",</text>
  <text x="200" y="360" font-family="monospace" font-size="16" fill="#4ADE80">"exp":1755043200}'</text>

  <text x="180" y="420" font-family="monospace" font-size="16" fill="#F59E0B">&gt; JSON.parse(...)</text>
  <text x="180" y="445" font-family="monospace" font-size="16" fill="#FCD34D">&lt; { sub: "user_123", exp: 1755043200 }</text>

  <text x="600" y="545" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#3730A3">Decode a JWT Without a Library</text>
</svg>