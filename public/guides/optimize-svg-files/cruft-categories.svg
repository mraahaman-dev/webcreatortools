<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FAFAF9"/>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">What a design tool adds that a browser doesn't need</text>

  <!-- Block 1 -->
  <g>
    <rect x="60" y="90" width="320" height="120" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="80" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4338CA">Editor metadata</text>
    <text x="80" y="146" font-family="monospace" font-size="11" fill="#6366F1">&lt;!-- Generator: Tool v28 --&gt;</text>
    <text x="80" y="164" font-family="monospace" font-size="11" fill="#6366F1">xmlns:xlink="..."</text>
    <text x="80" y="182" font-family="system-ui, sans-serif" font-size="12" fill="#4F46E5">Round-trip info the browser ignores</text>
  </g>

  <!-- Block 2 -->
  <g>
    <rect x="420" y="90" width="320" height="120" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="440" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803D">Excess precision</text>
    <text x="440" y="146" font-family="monospace" font-size="11" fill="#16A34A">d="M12.384729384 8.1..."</text>
    <text x="440" y="164" font-family="monospace" font-size="11" fill="#16A34A">→ M12.38 8.1</text>
    <text x="440" y="182" font-family="system-ui, sans-serif" font-size="12" fill="#15803D">Invisible at normal screen sizes</text>
  </g>

  <!-- Block 3 -->
  <g>
    <rect x="60" y="230" width="320" height="120" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="80" y="262" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#B45309">Redundant groups</text>
    <text x="80" y="286" font-family="monospace" font-size="11" fill="#D97706">&lt;g&gt;&lt;g&gt;&lt;g&gt;&lt;circle/&gt;&lt;/g&gt;&lt;/g&gt;&lt;/g&gt;</text>
    <text x="80" y="304" font-family="monospace" font-size="11" fill="#D97706">→ &lt;circle/&gt;</text>
    <text x="80" y="322" font-family="system-ui, sans-serif" font-size="12" fill="#B45309">Leftover from the design canvas layers</text>
  </g>

  <!-- Block 4 -->
  <g>
    <rect x="420" y="230" width="320" height="120" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="440" y="262" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#B91C1C">Unused definitions</text>
    <text x="440" y="286" font-family="monospace" font-size="11" fill="#DC2626">&lt;defs&gt;&lt;gradient id="unused"/&gt;</text>
    <text x="440" y="304" font-family="monospace" font-size="11" fill="#DC2626">&lt;/defs&gt;</text>
    <text x="440" y="322" font-family="system-ui, sans-serif" font-size="12" fill="#B91C1C">Never referenced by any shape</text>
  </g>
</svg>