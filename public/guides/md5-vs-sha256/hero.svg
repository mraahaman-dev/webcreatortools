<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg11)"/>

  <!-- MD5 broken lock -->
  <text x="300" y="200" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#991B1B">MD5</text>
  <rect x="240" y="230" width="120" height="90" rx="10" fill="#FECACA" stroke="#DC2626" stroke-width="3"/>
  <path d="M260 230 v-30 a40 40 0 0 1 80 0 v30" fill="none" stroke="#DC2626" stroke-width="8"/>
  <line x1="270" y1="240" x2="230" y2="280" stroke="#991B1B" stroke-width="5"/>
  <line x1="330" y1="240" x2="370" y2="280" stroke="#991B1B" stroke-width="5"/>
  <text x="300" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#991B1B">broken</text>

  <!-- divider -->
  <line x1="600" y1="150" x2="600" y2="450" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- SHA-256 secure lock -->
  <text x="900" y="200" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#166534">SHA-256</text>
  <rect x="840" y="230" width="120" height="90" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="3"/>
  <path d="M860 230 v-30 a40 40 0 0 1 80 0 v30" fill="none" stroke="#16A34A" stroke-width="8"/>
  <circle cx="900" cy="270" r="10" fill="#16A34A"/>
  <text x="900" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#166534">secure</text>

  <text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#3730A3">MD5 vs. SHA-256</text>
  <text x="600" y="568" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4338CA">Which hash should you use?</text>
</svg>