<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Collision Resistance</text>

  <!-- MD5 -->
  <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991B1B">MD5</text>
  <rect x="70" y="95" width="130" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="135" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#991B1B">File A</text>
  <rect x="270" y="95" width="130" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="335" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#991B1B">File B</text>
  <g stroke="#DC2626" stroke-width="2" fill="none">
    <line x1="135" y1="155" x2="200" y2="200"/>
    <line x1="335" y1="155" x2="270" y2="200"/>
  </g>
  <rect x="150" y="205" width="120" height="40" rx="6" fill="#DC2626"/>
  <text x="210" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFFFF">same hash</text>
  <text x="210" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991B1B">deliberately engineered,</text>
  <text x="210" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991B1B">seconds on ordinary hardware</text>

  <!-- SHA-256 -->
  <text x="600" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">SHA-256</text>
  <rect x="470" y="95" width="130" height="60" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="535" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">File A</text>
  <rect x="670" y="95" width="130" height="60" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="735" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">File B</text>
  <g stroke="#16A34A" stroke-width="2" fill="none">
    <line x1="535" y1="155" x2="580" y2="200"/>
    <line x1="735" y1="155" x2="690" y2="200"/>
  </g>
  <rect x="560" y="205" width="70" height="40" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="595" y="230" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#16A34A">✕</text>
  <text x="660" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534"> </text>
  <text x="595" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">no known practical</text>
  <text x="595" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">method to force a match</text>

  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4B5563">MD5's collision weakness is what makes it unsafe wherever tampering matters.</text>
</svg>