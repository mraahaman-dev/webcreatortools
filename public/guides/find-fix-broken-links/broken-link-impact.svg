<!-- broken-link-impact.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Link Authority: Intact vs Broken</text>

  <text x="200" y="90" font-family="sans-serif" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">Intact link</text>
  <circle cx="120" cy="150" r="35" fill="#16A34A"/>
  <text x="120" y="156" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Page A</text>
  <path d="M155 150 L245 150" stroke="#16A34A" stroke-width="3" marker-end="url(#g)"/>
  <circle cx="280" cy="150" r="35" fill="#16A34A"/>
  <text x="280" y="156" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Page B</text>
  <text x="200" y="210" font-family="sans-serif" font-size="13" fill="#166534" text-anchor="middle">Authority flows through</text>

  <text x="600" y="90" font-family="sans-serif" font-size="15" font-weight="600" fill="#991B1B" text-anchor="middle">Broken link</text>
  <circle cx="520" cy="150" r="35" fill="#DC2626"/>
  <text x="520" y="156" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Page A</text>
  <path d="M555 150 L645 150" stroke="#DC2626" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="680" cy="150" r="35" fill="#94A3B8"/>
  <text x="680" y="156" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">404</text>
  <text x="600" y="210" font-family="sans-serif" font-size="13" fill="#991B1B" text-anchor="middle">Dead end, nothing passed forward</text>

  <defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#16A34A"/></marker></defs>
</svg>