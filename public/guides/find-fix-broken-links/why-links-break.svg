<!-- why-links-break.svg -->
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#F8FAFC"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">The Linking Page Doesn't Change — the Destination Does</text>

  <line x1="80" y1="220" x2="720" y2="220" stroke="#CBD5E1" stroke-width="2"/>

  <circle cx="150" cy="220" r="10" fill="#4F46E5"/>
  <text x="150" y="180" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">Link added</text>
  <text x="150" y="260" font-family="sans-serif" font-size="13" fill="#166534" text-anchor="middle">Works fine</text>

  <circle cx="450" cy="220" r="10" fill="#F59E0B"/>
  <text x="450" y="180" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">Destination moves</text>
  <text x="450" y="260" font-family="sans-serif" font-size="13" fill="#92400E" text-anchor="middle">Link still points to old URL</text>

  <circle cx="700" cy="220" r="10" fill="#DC2626"/>
  <text x="700" y="180" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">Now</text>
  <text x="700" y="260" font-family="sans-serif" font-size="13" fill="#991B1B" text-anchor="middle">Broken link</text>
</svg>