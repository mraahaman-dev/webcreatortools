<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- SVG file card -->
  <g>
    <rect x="120" y="205" width="260" height="220" rx="16" fill="#FFFFFF" stroke="#818CF8" stroke-width="3"/>
    <rect x="150" y="245" width="200" height="14" rx="7" fill="#C7D2FE"/>
    <rect x="150" y="275" width="160" height="14" rx="7" fill="#C7D2FE"/>
    <circle cx="250" cy="345" r="40" fill="none" stroke="#4F46E5" stroke-width="6"/>
    <path d="M230 345 L245 360 L275 325" fill="none" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="405" text-anchor="middle" font-family="monospace" font-size="20" fill="#4338CA">.svg</text>
  </g>

  <!-- Arrow -->
  <g stroke="#4F46E5" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="420" y1="315" x2="540" y2="315"/>
    <path d="M515 290 L540 315 L515 340"/>
  </g>

  <!-- CSS code card -->
  <g>
    <rect x="580" y="180" width="500" height="270" rx="16" fill="#1E1B4B"/>
    <circle cx="615" cy="212" r="7" fill="#DC2626"/>
    <circle cx="640" cy="212" r="7" fill="#F59E0B"/>
    <circle cx="665" cy="212" r="7" fill="#16A34A"/>

    <text x="612" y="255" font-family="monospace" font-size="18" fill="#A5B4FC">.icon {</text>
    <text x="632" y="285" font-family="monospace" font-size="16" fill="#818CF8">background-image:</text>
    <text x="632" y="310" font-family="monospace" font-size="14" fill="#4ADE80">url("data:image/svg+xml,</text>
    <text x="652" y="330" font-family="monospace" font-size="14" fill="#4ADE80">%3Csvg xmlns=...%3E</text>
    <text x="652" y="350" font-family="monospace" font-size="14" fill="#4ADE80">...%3C/svg%3E");</text>
    <text x="612" y="380" font-family="monospace" font-size="18" fill="#A5B4FC">}</text>
  </g>

  <text x="600" y="540" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#3730A3">SVG to CSS Background Image</text>
  <text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4338CA">Converting a file into a data URI</text>
</svg>