<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Cached File vs. Repeated Inline Data URI</text>

  <!-- Left: cached svg file -->
  <text x="200" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">Separate .svg file</text>
  <rect x="100" y="95" width="200" height="50" rx="8" fill="#BBF7D0" stroke="#16A34A" stroke-width="2"/>
  <text x="200" y="125" text-anchor="middle" font-family="monospace" font-size="13" fill="#166534">icon.svg (cached once)</text>

  <g stroke="#16A34A" stroke-width="2" fill="none">
    <line x1="200" y1="145" x2="200" y2="190"/>
    <line x1="150" y1="190" x2="250" y2="190"/>
    <line x1="150" y1="190" x2="150" y2="230"/>
    <line x1="200" y1="190" x2="200" y2="230"/>
    <line x1="250" y1="190" x2="250" y2="230"/>
  </g>
  <rect x="105" y="230" width="90" height="34" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
  <rect x="155" y="230" width="90" height="34" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
  <rect x="205" y="230" width="90" height="34" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
  <text x="150" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338CA">Page 1</text>
  <text x="200" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338CA">Page 2</text>
  <text x="250" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338CA">Page 3</text>
  <text x="200" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#166534">1 download total</text>

  <!-- Right: inlined data uri -->
  <text x="600" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#B45309">Inlined data URI</text>
  <rect x="480" y="95" width="80" height="40" rx="6" fill="#FDE68A" stroke="#D97706"/>
  <rect x="560" y="95" width="80" height="40" rx="6" fill="#FDE68A" stroke="#D97706"/>
  <rect x="640" y="95" width="80" height="40" rx="6" fill="#FDE68A" stroke="#D97706"/>
  <text x="520" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400E">style.css</text>
  <text x="600" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400E">style.css</text>
  <text x="680" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400E">style.css</text>

  <g stroke="#D97706" stroke-width="2" fill="none">
    <line x1="520" y1="135" x2="520" y2="230"/>
    <line x1="600" y1="135" x2="600" y2="230"/>
    <line x1="680" y1="135" x2="680" y2="230"/>
  </g>
  <rect x="475" y="230" width="90" height="34" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
  <rect x="555" y="230" width="90" height="34" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
  <rect x="635" y="230" width="90" height="34" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
  <text x="520" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338CA">Page 1</text>
  <text x="600" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338CA">Page 2</text>
  <text x="680" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338CA">Page 3</text>
  <text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B45309">3 downloads (duplicated)</text>

  <text x="400" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Inlining trades one shared, cacheable request for a copy baked into every stylesheet that uses it.</text>
</svg>