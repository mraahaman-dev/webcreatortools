<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Decorative vs. Meaningful Icons</text>

  <!-- decorative -->
  <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">Decorative (hide it)</text>
  <rect x="90" y="110" width="220" height="60" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="120" y="147" font-family="sans-serif" font-size="16" fill="#3730A3">Learn more</text>
  <path d="M255 130 L280 140 L255 150" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="245" y="118" width="45" height="45" rx="6" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="200" text-anchor="middle" font-family="monospace" font-size="12" fill="#6B7280">aria-hidden="true"</text>
  <text x="200" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6B7280">arrow duplicates visible text</text>

  <!-- meaningful -->
  <text x="600" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">Standalone (label it)</text>
  <rect x="540" y="105" width="70" height="70" rx="14" fill="#4F46E5"/>
  <path d="M562 145 h36 M580 127 v36" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <text x="575" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">no visible text nearby</text>
  <text x="575" y="227" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">aria-label="Add item"</text>

  <text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">If adjacent text already says it, hide the icon.</text>
  <text x="400" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">If the icon is the only label, give it one explicitly.</text>
</svg>