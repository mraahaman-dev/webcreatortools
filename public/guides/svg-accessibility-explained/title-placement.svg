<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">Where &lt;title&gt; Must Go</text>

  <!-- correct -->
  <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">Correct</text>
  <rect x="70" y="95" width="260" height="150" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="90" y="125" font-family="monospace" font-size="13" fill="#166534">&lt;svg&gt;</text>
  <rect x="85" y="135" width="220" height="28" rx="5" fill="#BBF7D0"/>
  <text x="95" y="154" font-family="monospace" font-size="12" fill="#166534">&lt;title&gt;Search&lt;/title&gt;</text>
  <text x="90" y="190" font-family="monospace" font-size="13" fill="#166534">&lt;path d="..."/&gt;</text>
  <text x="90" y="220" font-family="monospace" font-size="13" fill="#166534">&lt;/svg&gt;</text>
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">title is the first child → announced</text>

  <!-- incorrect -->
  <text x="600" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991B1B">Incorrect</text>
  <rect x="470" y="95" width="260" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="490" y="125" font-family="monospace" font-size="13" fill="#991B1B">&lt;svg&gt;</text>
  <text x="490" y="155" font-family="monospace" font-size="13" fill="#991B1B">&lt;path d="..."/&gt;</text>
  <rect x="485" y="170" width="220" height="28" rx="5" fill="#FECACA"/>
  <text x="495" y="189" font-family="monospace" font-size="12" fill="#991B1B">&lt;title&gt;Search&lt;/title&gt;</text>
  <text x="490" y="220" font-family="monospace" font-size="13" fill="#991B1B">&lt;/svg&gt;</text>
  <text x="600" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991B1B">title comes after path → often skipped</text>

  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Many screen readers only look for &lt;title&gt; as the first child element.</text>
</svg>