<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3730A3">Five Fields, Fixed Order</text>

  <rect x="60" y="60" width="680" height="60" rx="10" fill="#1E1B4B"/>
  <text x="120" y="98" text-anchor="middle" font-family="monospace" font-size="22" fill="#4ADE80">0</text>
  <text x="260" y="98" text-anchor="middle" font-family="monospace" font-size="22" fill="#FCD34D">9</text>
  <text x="400" y="98" text-anchor="middle" font-family="monospace" font-size="22" fill="#818CF8">*</text>
  <text x="540" y="98" text-anchor="middle" font-family="monospace" font-size="22" fill="#FCA5A5">*</text>
  <text x="670" y="98" text-anchor="middle" font-family="monospace" font-size="22" fill="#F472B6">1</text>

  <g stroke="#818CF8" stroke-width="1.5">
    <line x1="120" y1="120" x2="120" y2="150"/>
    <line x1="260" y1="120" x2="260" y2="150"/>
    <line x1="400" y1="120" x2="400" y2="150"/>
    <line x1="540" y1="120" x2="540" y2="150"/>
    <line x1="670" y1="120" x2="670" y2="150"/>
  </g>

  <text x="120" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">minute</text>
  <text x="120" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">0-59</text>

  <text x="260" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400E">hour</text>
  <text x="260" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400E">0-23</text>

  <text x="400" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3730A3">day of month</text>
  <text x="400" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3730A3">1-31</text>

  <text x="540" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991B1B">month</text>
  <text x="540" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991B1B">1-12</text>

  <text x="670" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#BE185D">day of week</text>
  <text x="670" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BE185D">0-6</text>

  <text x="400" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">"0 9 * * 1" reads as: at minute 0, hour 9, any day of month,</text>
  <text x="400" y="272" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">any month, only on day-of-week 1 (Monday) — 9am every Monday.</text>
</svg>