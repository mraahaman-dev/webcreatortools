<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">What */15 Actually Selects</text>

  <text x="400" y="75" text-anchor="middle" font-family="monospace" font-size="20" fill="#4F46E5">*/15</text>
  <text x="400" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6366F1">in the minute field</text>

  <!-- timeline -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#C7D2FE" stroke-width="3"/>

  <!-- 60 minute ticks, highlight every 15 -->
  <g>
    <circle cx="60" cy="200" r="9" fill="#4F46E5"/>
    <text x="60" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#3730A3">:00</text>

    <circle cx="230" cy="200" r="9" fill="#4F46E5"/>
    <text x="230" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#3730A3">:15</text>

    <circle cx="400" cy="200" r="9" fill="#4F46E5"/>
    <text x="400" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#3730A3">:30</text>

    <circle cx="570" cy="200" r="9" fill="#4F46E5"/>
    <text x="570" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#3730A3">:45</text>

    <circle cx="740" cy="200" r="6" fill="#C7D2FE"/>
    <text x="740" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#818CF8">:59</text>
  </g>

  <text x="400" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Fires at minutes 0, 15, 30, and 45 — every 15 minutes, starting from 0.</text>
  <text x="400" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">Not "every 15 minutes from whenever the job was created."</text>
</svg>