<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3730A3">Reciprocal vs. Broken Linking</text>

  <!-- correct set -->
  <text x="200" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">Correct: fully reciprocal</text>
  <circle cx="130" cy="140" r="30" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="130" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#166534">EN</text>
  <circle cx="270" cy="140" r="30" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="270" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#166534">FR</text>
  <g stroke="#16A34A" stroke-width="2" fill="none">
    <line x1="160" y1="132" x2="240" y2="132"/>
    <line x1="160" y1="148" x2="240" y2="148"/>
  </g>
  <text x="200" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">each links to the other + itself</text>

  <!-- broken set -->
  <text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991B1B">Broken: one-way only</text>
  <circle cx="530" cy="140" r="30" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="530" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#991B1B">EN</text>
  <circle cx="670" cy="140" r="30" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="670" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#991B1B">FR</text>
  <g stroke="#DC2626" stroke-width="2" fill="none">
    <line x1="560" y1="140" x2="640" y2="140"/>
    <path d="M628 132 L640 140 L628 148"/>
  </g>
  <text x="600" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991B1B">FR doesn't link back to EN</text>

  <text x="400" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">One missing direction is enough for search engines to flag</text>
  <text x="400" y="302" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">the entire hreflang set as unreliable.</text>
</svg>