<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3730A3">128-Bit Layout</text>

  <!-- v4 -->
  <text x="120" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">UUID v4</text>
  <g>
    <rect x="120" y="95" width="560" height="40" fill="#818CF8"/>
    <rect x="120" y="95" width="560" height="40" fill="none" stroke="#4F46E5" stroke-width="1"/>
  </g>
  <text x="400" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">122 bits random + version/variant bits</text>

  <!-- v7 -->
  <text x="120" y="190" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4B5563">UUID v7</text>
  <rect x="120" y="205" width="210" height="40" fill="#4F46E5"/>
  <rect x="330" y="205" width="350" height="40" fill="#C7D2FE"/>
  <text x="225" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">48-bit timestamp (ms)</text>
  <text x="505" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3730A3">random bits</text>

  <text x="120" y="290" font-family="sans-serif" font-size="13" fill="#4B5563">bit 0</text>
  <text x="655" y="290" font-family="sans-serif" font-size="13" fill="#4B5563">bit 127</text>

  <text x="400" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">v7's leading timestamp is why its string form sorts chronologically;</text>
  <text x="400" y="367" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4B5563">v4 has no such structure anywhere in its 128 bits.</text>
</svg>